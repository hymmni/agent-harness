# 하네스를 프로젝트에 설치(copier copy)하고 갱신(copier update)하는 설정. 사용법은 README를 참고한다.
_min_copier_version: "9.0"

# 이 레포 루트가 템플릿이다. 아래는 템플릿 개발용이라 프로젝트로 복사하지 않는다.
# 새 파일을 루트에 추가하면 tests/test_copier.py가 복사 여부를 결정하라고 실패한다.
# 패턴은 .gitignore 문법이다. 앞에 /가 없으면 하위 폴더의 같은 이름까지 제외된다.
_exclude:
  - /copier.yml
  - /.gitignore
  - /README.md
  - /tests
  - /docs/superpowers
  - /references
  - /experiments
  - /scratch
  - /.superpowers
  - /.github          # 하네스 이슈 양식과 릴리즈 워크플로. 프로젝트용은 각 프로젝트가 만든다.
  - /release-please-config.json
  - /.release-please-manifest.json
  - /version.txt
  - /CHANGELOG.md
  - .git
  - __pycache__
  - "*.py[co]"
  - .pytest_cache

# 프로젝트가 채워 쓰는 파일은 처음 한 번만 만들고, 갱신할 때 덮어쓰지 않는다.
_skip_if_exists:
  - docs/ADR.md
  - docs/ARCHITECTURE.md
  - docs/private/ENVIRONMENT.md
  - requirements.txt

research:
  type: bool
  default: false
  help: 연구용 규칙(실험 기록, 하드웨어 문서, 대용량 파일 제외)도 설치할까요? (docs/RESEARCH.md)

# hook과 setup.py는 이 답을 .copier-answers.yml에서 `main_via_pr: false` 같은 줄로 읽는다.
main_via_pr:
  type: bool
  default: true
  help: main 반영을 PR로만 할까요? 아니라고 하면 사람이 로컬에서 main에 병합하고 push합니다.

with_docker:
  type: bool
  default: false
  help: Docker/devcontainer 개발 환경 스캐폴드도 설치할까요? (DOCKER.md 참고)

project_slug:
  type: str
  default: "{{ _folder_name | lower | regex_replace('[^a-z0-9._-]+', '-') }}"
  help: Docker 이미지 이름
  when: "{{ with_docker }}"
