name: 하네스 개선 제안
description: 규칙, 워크플로우, 설치 방식, 문서를 바꾸자는 제안
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 이 레포는 public입니다. 프로젝트 이름, 코드, 파일 경로, 서버나 PC 정보는 적지 마세요. 상황은 일반적인 말로 설명해 주세요.
  - type: textarea
    id: situation
    attributes:
      label: 어떤 상황에서 불편했나요
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 무엇을 어떻게 바꾸면 좋을지
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
