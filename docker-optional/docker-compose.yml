services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: __PROJECT_NAME__/dev:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
    stdin_open: true
    tty: true
